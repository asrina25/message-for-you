<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message For You 💙</title>

    <style>
        body {
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4facfe, #00c6ff);
            overflow: hidden;
        }

        h1 {
            color: white;
            font-size: 28px;
            text-align: center;
            line-height: 1.4;
            animation: fadeIn 2s ease-in-out;
        }

        button {
            margin-top: 25px;
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 25px;
            background-color: white;
            color: #0077ff;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            width: 80%;
            max-width: 250px;
        }

        button:hover {
            background-color: #0077ff;
            color: white;
            transform: scale(1.05);
        }

        /* Floating circles */
        .bubble {
            position: absolute;
            bottom: -50px;
            width: 30px;
            height: 30px;
            background: rgba(255,255,255,0.2);
            border-radius: 50%;
            animation: rise 10s infinite ease-in;
        }

        @keyframes rise {
            0% {
                transform: translateY(0);
                opacity: 0.5;
            }
            100% {
                transform: translateY(-100vh);
                opacity: 0;
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 📱 Mobile optimization */
        @media (max-width: 480px) {
            h1 {
                font-size: 22px;
            }

            button {
                font-size: 15px;
                padding: 10px 20px;
            }

            .bubble {
                width: 20px;
                height: 20px;
            }
        }
    </style>
</head>

<body>

    <h1>
        Here Is A Message From Your Fiancé 💙<br>
        Make sure you are alone… I want this moment to be just ours.
    </h1>

    <button onclick="openMessage()">Open 💙</button>

    <!-- Bubbles -->
    <div class="bubble" style="left:10%; animation-duration:8s;"></div>
    <div class="bubble" style="left:30%; animation-duration:10s;"></div>
    <div class="bubble" style="left:50%; animation-duration:7s;"></div>
    <div class="bubble" style="left:70%; animation-duration:9s;"></div>
    <div class="bubble" style="left:90%; animation-duration:11s;"></div>

    <script>
        function openMessage() {
            window.location.href = "page2.html";
        }
    </script>

</body>
</html>
